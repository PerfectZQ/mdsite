name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/)
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Run this workflow on a version tag')
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`)
          assert.equal(lock.version, pkg.version)
          assert.equal(lock.packages[''].version, pkg.version)
          JS
      - run: npm ci
      - name: Check, test and pack
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          version=$(node -p "require('./package.json').version")
          mv "$RUNNER_TEMP/mdsite-${version}.tgz" "$RUNNER_TEMP/mdsite.tgz"
      - name: Verify installed package
        run: node scripts/verify-package.ts "$RUNNER_TEMP/mdsite.tgz"
      - name: Verify reader in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:reader
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum mdsite.tgz > mdsite.tgz.sha256
          cat > release-notes.md <<EOF
          ## 安装

          需要 Node.js 24+。直接从 GitHub 下载并安装此版本：

          \`\`\`sh
          npm install -g https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/mdsite.tgz
          mdsite version
          \`\`\`

          ## 本地预览

          在包含 Markdown 的项目目录运行，用浏览器打开终端显示的地址，修改文档后刷新页面：

          \`\`\`sh
          mdsite serve .
          \`\`\`

          ## 构建静态资源

          生成独立 HTML，供离线分发或已有网站、业务服务托管：

          \`\`\`sh
          mdsite build . -o public/docs/index.html
          \`\`\`

          使用说明：https://github.com/${GH_REPO}/blob/${RELEASE_TAG}/doc/QUICK_START.md
          EOF
          gh release create "$RELEASE_TAG" mdsite.tgz mdsite.tgz.sha256 \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
